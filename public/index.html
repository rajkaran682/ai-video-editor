<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b12"><title>AI Video Editor Pro</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b>✦ AI Video Editor Pro</b><small>Wedding & Event Studio</small><button id="new">＋ New</button></header>
<main><section class="work"><div class="preview"><div class="bar"><span id="status">Ready</span><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select><select id="quality"><option>720</option><option selected>1080</option><option>480</option></select></div><canvas id="stage"></canvas><div class="actions"><button id="play">▶ Preview</button><button id="export">● Export Video</button><progress id="progress" max="100" value="0"></progress></div></div><div class="timeline"><b>Timeline</b><span id="clock">00:00 / 00:30</span><input id="seek" type="range" min="0" max="30" value="0" step=".01"></div></section>
<aside><nav id="tabs"></nav><div id="pages"></div></aside></main><script src="/app.js"></script></body></html>
